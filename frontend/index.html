<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Examination Portal – Login</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); }
    .tabs button {
      flex: 1; padding: 0.65rem; background: none; border: none; cursor: pointer;
      font-size: 0.95rem; font-weight: 500; color: var(--muted);
      border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s;
    }
    .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; } .tab-panel.active { display: block; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="logo">
      <h1>🎓 AI Exam Portal</h1>
      <p>Intelligent Online Examination System</p>
    </div>

    <div class="tabs">
      <button class="active" onclick="switchTab('login')">Login</button>
      <button onclick="switchTab('register')">Register</button>
    </div>

    <div id="alert-box"></div>

    <!-- Login Panel -->
    <div id="tab-login" class="tab-panel active">
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">Login</button>
      </form>
    </div>

    <!-- Register Panel -->
    <div id="tab-register" class="tab-panel">
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password <span class="text-muted">(min. 6 characters)</span></label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">Create Account</button>
      </form>
    </div>

    <p class="text-muted text-center mt-2" style="font-size:.8rem">
      Teachers/Admins: contact your administrator for login credentials.
    </p>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    // Redirect if already logged in
    (function() {
      const u = getUser(); const t = getToken();
      if (u && t) {
        if (u.role === 'student') window.location.href = '/student/dashboard.html';
        else window.location.href = '/teacher/dashboard.html';
      }
    })();

    function switchTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.target.classList.add('active');
      document.getElementById('alert-box').innerHTML = '';
    }

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const data = await API.post('/auth/login', { email, password });
        setToken(data.token);
        setUser(data.user);
        if (data.user.role === 'student') window.location.href = '/student/dashboard.html';
        else window.location.href = '/teacher/dashboard.html';
      } catch (err) {
        showAlert('alert-box', 'danger', err.message);
        btn.disabled = false; btn.textContent = 'Login';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name     = document.getElementById('reg-name').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn      = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        await API.post('/auth/register', { name, email, password });
        showAlert('alert-box', 'success', 'Account created! Please login.');
        document.getElementById('register-form').reset();
        // Switch to login tab
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-login').classList.add('active');
        document.querySelectorAll('.tabs button')[0].classList.add('active');
      } catch (err) {
        showAlert('alert-box', 'danger', err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
